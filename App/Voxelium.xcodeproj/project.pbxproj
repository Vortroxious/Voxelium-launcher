			shellPath = /bin/sh;
			shellScript = "set -e\nSRC=\"${PROJECT_DIR}/../build/runtime\"\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/java\"\nif [ ! -f \"$SRC/jre17/lib/server/libjvm.dylib\" ] || [ ! -f \"$SRC/voxelium-javatest.jar\" ]; then\n  echo \"error: Java runtime not found in build/runtime. Run scripts/fetch-runtime.sh first.\"\n  exit 1\nfi\nrm -rf \"$DEST\"\nmkdir -p \"$DEST\"\n# -L: legal/ uses symlinks, which app signing does not like.\n# Every runtime scripts/fetch-runtime.sh unpacked (jre8, jre17, jre21, jre25); jre17 is required.\nfor jre in \"$SRC\"/jre*; do\n  [ -d \"$jre\" ] && [ -f \"$jre/release\" ] || continue\n  cp -RL \"$jre\" \"$DEST/$(basename \"$jre\")\"\ndone\ncp \"$SRC/voxelium-javatest.jar\" \"$DEST/\"\n# LWJGL (built by scripts/build-lwjgl.sh) and the Java graphics test.\nLW=\"${PROJECT_DIR}/../build/deps/lwjgl-out\"\nif [ -f \"$LW/natives/liblwjgl.dylib\" ] && [ -f \"$LW/voxelium-glestest.jar\" ]; then\n  mkdir -p \"$DEST/lwjgl\"\n  cp \"$LW\"/jars/*.jar \"$LW\"/natives/*.dylib \"$DEST/lwjgl/\"\n  cp \"$LW/voxelium-glestest.jar\" \"$DEST/\"\n  [ -f \"$LW/voxelium-ios-compat.jar\" ] && cp \"$LW/voxelium-ios-compat.jar\" \"$DEST/\"\n  # openal-soft (scripts/build-openal.sh), loaded by LWJGL's OpenAL binding as libopenal.dylib.\n  OA=\"${PROJECT_DIR}/../build/deps/openal-out/libopenal.dylib\"\n  if [ -f \"$OA\" ]; then cp \"$OA\" \"$DEST/lwjgl/\"; else echo \"warning: OpenAL not built (scripts/build-openal.sh); Minecraft sound init will fail.\"; fi\n  # FreeType (scripts/build-freetype.sh) for lwjgl-freetype (Minecraft 1.20.5+).\n  FT=\"${PROJECT_DIR}/../build/deps/freetype-out/libfreetype.dylib\"\n  if [ -f \"$FT\" ]; then cp \"$FT\" \"$DEST/lwjgl/\"; else echo \"warning: FreeType not built (scripts/build-freetype.sh); Minecraft 1.20.5+ will fail.\"; fi\n  # LWJGL 3.4.1 (LWJGL_SERIES=3.4.1 scripts/build-lwjgl.sh) for Minecraft 26.1 - 26.2.\n  LW4=\"${PROJECT_DIR}/../build/deps/lwjgl-out-3.4.1\"\n  if [ -f \"$LW4/natives/liblwjgl.dylib\" ]; then\n    mkdir -p \"$DEST/lwjgl-3.4.1\"\n    cp \"$LW4\"/jars/*.jar \"$LW4\"/natives/*.dylib \"$DEST/lwjgl-3.4.1/\"\n    [ -f \"$OA\" ] && cp \"$OA\" \"$DEST/lwjgl-3.4.1/\"\n    [ -f \"$FT\" ] && cp \"$FT\" \"$DEST/lwjgl-3.4.1/\"\n  else\n    echo \"warning: LWJGL 3.4.1 not built; Minecraft 26.x will be refused.\"\n  fi\nelse\n  echo \"warning: LWJGL not built (scripts/build-lwjgl.sh); the Java graphics test will be unavailable.\"\nfi\n# Microsoft sign-in app (client) ID, kept out of the repository like ZalithLauncher2's:\n# $VX_MS_CLIENT_ID or the git-ignored .oauth_client_id.txt at the repository root.\nRES=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nCID=\"${VX_MS_CLIENT_ID:-}\"\n[ -z \"$CID\" ] && [ -f \"${PROJECT_DIR}/../.oauth_client_id.txt\" ] && CID=\"$(tr -d ' \\t\\r\\n' < \"${PROJECT_DIR}/../.oauth_client_id.txt\")\"\nif [ -n \"$CID\" ]; then printf '%s' \"$CID\" > \"$RES/microsoft-client-id.txt\"; else rm -f \"$RES/microsoft-client-id.txt\"; echo \"note: no .oauth_client_id.txt; Microsoft sign-in uses the built-in Minecraft launcher client ID (see docs/MICROSOFT_SIGN_IN.md).\"; fi\n# Xcode signs only the main binary and frameworks; sign the loose dylibs too\n# when signing is enabled (sideloading tools re-sign everything anyway).\nif [ \"${CODE_SIGNING_ALLOWED}\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY}\" ]; then\n  find \"$DEST\" -name \"*.dylib\" -exec codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --timestamp=none {} \;\nfi\n";
